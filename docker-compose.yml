version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pix-wallet-postgres
    environment:
      POSTGRES_DB: pixwallet
      POSTGRES_USER: pixuser
      POSTGRES_PASSWORD: pixpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixuser -d pixwallet"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
