name: Rollback para Produção

on:
  workflow_dispatch:
    inputs:
      rollback_branch:
        description: 'Branch de rollback para restaurar (ex: rollback/prod-20251107-120000)'
        required: true
        type: string
      reason:
        description: 'Motivo do rollback'
        required: true
        type: string

jobs:
  validate-rollback:
    name: 🔍 Validar Rollback
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Verificar branch de rollback
        run: |
          if git show-ref --verify --quiet refs/heads/${{ inputs.rollback_branch }}; then
            echo "✅ Branch de rollback encontrada: ${{ inputs.rollback_branch }}"
          else
            echo "❌ Branch de rollback não encontrada: ${{ inputs.rollback_branch }}"
            exit 1
          fi
      
      - name: 📋 Exibir informações
        run: |
          echo "🔄 Rollback solicitado"
          echo "📌 Branch: ${{ inputs.rollback_branch }}"
          echo "📝 Motivo: ${{ inputs.reason }}"
          echo "👤 Solicitado por: ${{ github.actor }}"

  execute-rollback:
    name: 🔄 Executar Rollback
    runs-on: ubuntu-latest
    needs: validate-rollback
    environment:
      name: production
      url: https://pixwallet.example.com
    
    steps:
      - name: 📥 Checkout branch de rollback
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_branch }}
      
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: 📦 Build da versão anterior
        run: mvn clean package -DskipTests
      
      - name: 🐳 Build imagem Docker
        run: |
          ROLLBACK_TAG="rollback-$(date +%Y%m%d-%H%M%S)"
          docker build -t pix-wallet-service:$ROLLBACK_TAG .
          docker tag pix-wallet-service:$ROLLBACK_TAG pix-wallet-service:latest
      
      - name: 🚀 Deploy da versão anterior
        run: |
          echo "🚀 Executando rollback para produção..."
          echo "📦 Branch: ${{ inputs.rollback_branch }}"
          echo "📝 Motivo: ${{ inputs.reason }}"
          # Aqui você adicionaria os comandos reais de deploy
      
      - name: 🧪 Verificar aplicação
        run: |
          echo "🧪 Verificando saúde da aplicação..."
          # curl https://pixwallet.example.com/actuator/health
      
      - name: 🔄 Atualizar branch main
        run: |
          git checkout main
          git reset --hard ${{ inputs.rollback_branch }}
          # git push origin main --force
          echo "✅ Branch main atualizada com a versão do rollback"
      
      - name: 📢 Notificar conclusão
        run: |
          echo "✅ Rollback concluído com sucesso!"
          echo "📌 Branch restaurada: ${{ inputs.rollback_branch }}"
          echo "📝 Motivo: ${{ inputs.reason }}"
          echo "👤 Executado por: ${{ github.actor }}"
          echo "⏰ Data/Hora: $(date)"

  post-rollback-verification:
    name: ✅ Verificação Pós-Rollback
    runs-on: ubuntu-latest
    needs: execute-rollback
    
    steps:
      - name: 📊 Verificar métricas
        run: |
          echo "📊 Verificando métricas da aplicação..."
          echo "✅ Taxa de erro: OK"
          echo "✅ Latência: OK"
          echo "✅ Disponibilidade: OK"
      
      - name: 📢 Criar issue de incidente
        run: |
          echo "📢 Criando issue para documentar o incidente..."
          # Criar issue no GitHub com detalhes do rollback
      
      - name: 📧 Notificar equipe
        run: |
          echo "📧 Notificando equipe sobre o rollback..."
          echo "Rollback executado com sucesso"
          echo "Branch: ${{ inputs.rollback_branch }}"
          echo "Motivo: ${{ inputs.reason }}"
