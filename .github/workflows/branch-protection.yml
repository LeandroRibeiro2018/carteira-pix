name: Proteção de Branches

on:
  pull_request:
    branches:
      - main
      - homolog
      - dev
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    name: 🔍 Validar Pull Request
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🔍 Validar origem do PR
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"
          
          echo "📌 Source: $SOURCE_BRANCH"
          echo "📌 Target: $TARGET_BRANCH"
          
          # Validar que PR para main vem apenas de homolog
          if [[ "$TARGET_BRANCH" == "main" && "$SOURCE_BRANCH" != "homolog" ]]; then
            echo "❌ PR para main só aceita de homolog"
            exit 1
          fi
          
          # Validar que PR para homolog vem apenas de dev ou features
          if [[ "$TARGET_BRANCH" == "homolog" ]]; then
            if [[ "$SOURCE_BRANCH" != "dev" && ! "$SOURCE_BRANCH" =~ ^feature/ ]]; then
              echo "❌ PR para homolog só aceita de dev ou feature/*"
              exit 1
            fi
          fi
          
          echo "✅ Origem do PR válida"
      
      - name: 📋 Verificar título do PR
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          
          # Validar formato do título (ex: feat:, fix:, chore:)
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|chore|docs|refactor|test|style|perf|ci):\ .+ ]]; then
            echo "⚠️ Título do PR não segue o padrão: tipo: descrição"
            echo "Tipos aceitos: feat, fix, chore, docs, refactor, test, style, perf, ci"
          fi
      
      - name: 📝 Verificar descrição do PR
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          
          if [[ -z "$PR_BODY" ]]; then
            echo "⚠️ PR sem descrição"
          else
            echo "✅ PR contém descrição"
          fi

  require-tests:
    name: 🧪 Exigir Testes
    runs-on: ubuntu-latest
    needs: validate-pr
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pixwallet_test
          POSTGRES_USER: pixuser
          POSTGRES_PASSWORD: pixpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: 🧪 Executar todos os testes
        run: mvn verify
        env:
          SPRING_PROFILES_ACTIVE: test
          DATABASE_URL: jdbc:postgresql://localhost:5432/pixwallet_test
          DATABASE_USER: pixuser
          DATABASE_PASSWORD: pixpass
      
      - name: 📊 Verificar cobertura mínima
        run: |
          echo "📊 Verificando cobertura de testes..."
          # Adicionar verificação de cobertura mínima (ex: 80%)

  require-approvals:
    name: ✅ Exigir Aprovações
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.base_ref == 'homolog'
    
    steps:
      - name: 📋 Verificar número de aprovações
        run: |
          TARGET="${{ github.base_ref }}"
          
          if [[ "$TARGET" == "main" ]]; then
            echo "🔒 PR para main requer 2 aprovações"
            # Verificar aprovações via API do GitHub
          elif [[ "$TARGET" == "homolog" ]]; then
            echo "🔒 PR para homolog requer 1 aprovação"
          fi
      
      - name: 📢 Notificar revisores
        run: |
          echo "📢 Notificando revisores sobre o PR..."
          echo "PR: ${{ github.event.pull_request.html_url }}"
